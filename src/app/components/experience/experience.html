<div class="experiencewhole">
  <div class="container py-5">
    <div class="pb-3">
      <p class="m-0 text-left text-light">FEATURED PROJECTS</p>
      <h3 class="m-0 text-left fw-bold text-light">Things I've Built</h3>
    </div>
    <div class="timeline">

      @for(experience of experienceData();track experience.companyname){
        <div class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-icon">
            <i class="bi bi-briefcase-fill"></i>
          </div>
          <div class="timeline-content flex-grow-1">

            <div class="row g-3 align-items-start">

              <div class="col">
                <h5 class="fw-bold mb-1">
                  {{experience?.title}}
                </h5>

                <h6 class="fw-semibold mb-2">
                  {{experience?.companyname}}
                </h6>

                <ul class="mb-0 ps-3">
                  @for (responsibility of experience?.responsibilities;track responsibility){
                    <li>{{responsibility}}</li>
                  }
                </ul>
              </div>

              <!-- Date -->
              <div class="col-auto">
                <span class="date-badge">
                  {{experience?.date}}
                </span>
              </div>

            </div>

          </div>

        </div>
      }

    </div>
  </div>
</div>
