<div class="home-main-div">
  <div class="col-10 col-md-6 col-lg-4 aboutbox">
    <i class="bi bi-screwdriver screw screw-left" aria-hidden="true"></i>
    <i class="bi bi-screwdriver screw screw-right" aria-hidden="true"></i>
    <h1 class="text-light fw-bold">Hi, I'm
      <br/>
      {{aboutMedata()?.name}}
    </h1>
    <p class="text-light fw-bold">{{aboutMedata()?.role}}</p>
    <p class="text-light">{{aboutMedata()?.description}}</p>
    <div class="d-flex">
      <button type="button" class="btn btn-style text-light me-4">See My Work <i class="bi bi-arrow-right ms-1"></i></button>
      <button type="button" class="btn btn-style text-light"><i class="bi bi-send me-1"></i>Get In Touch</button>
    </div>
    <div class="d-flex mt-3 ms-1">
      <a [href]="aboutMedata()?.gitHub" target="_blank"><i class="bi bi-github text-light me-4 cursor-pointer"></i></a>
      <a [href]="aboutMedata()?.linkedIn" target="_blank"><i class="bi bi-linkedin text-light me-4 cursor-pointer"></i></a>
      <a [href]="'mailto:'+aboutMedata()?.mail" target="_blank"><i class="bi bi-envelope text-light cursor-pointer"></i></a>
    </div>
  </div>
</div>
